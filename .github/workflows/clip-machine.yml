name: Clip Machine - Transcribe and Find Moments

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: "Campaign to create clips for"
        required: true
        type: choice
        options:
          - blastoff_jingle_jared_rebel_audio
          - blastoff_warren_zeiders_md_motivator

      video_url:
        description: "Direct HTTPS video URL (leave empty to use input/)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: clip-machine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-clips:
    name: Download, Analyze, and Create Clips
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
              python -m pip install faster-whisper gdown   
          

      - name: Create working directories
        run: |
          mkdir -p input
          mkdir -p work
          mkdir -p output/clips
          mkdir -p output/rebel_audio_clips
          mkdir -p output/posting_packages

      - name: Select video source
        id: source
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        shell: bash
        run: |
          set -euo pipefail

                    if [ -n "$VIDEO_URL" ]; then
            if [[ "$VIDEO_URL" == *"drive.google.com/drive/folders/"* ]]; then
              echo "source_type=drive_folder" >> "$GITHUB_OUTPUT"
              echo "Google Drive folder detected."
            else
              echo "source_type=url" >> "$GITHUB_OUTPUT"
              echo "Single video URL detected."
            fi
            
          else
            VIDEO_FILE="$(find input -maxdepth 1 -type f \
              \( -iname '*.mp4' -o -iname '*.mov' \
              -o -iname '*.mkv' -o -iname '*.webm' \
              -o -iname '*.m4v' \) \
              ! -name '.gitkeep' | head -n 1)"

            if [ -z "$VIDEO_FILE" ]; then
              echo "No video URL or local video was provided."
              echo "Add a direct HTTPS URL or put a video in input/."
              exit 1
            fi

            echo "source_type=local" >> "$GITHUB_OUTPUT"
            echo "video=$VIDEO_FILE" >> "$GITHUB_OUTPUT"
            echo "Using local video: $VIDEO_FILE"
          fi

      - name: Download video from URL
        if: steps.source.outputs.source_type == 'url'
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail

          python scripts/download_video.py \
            "$VIDEO_URL" \
            work/source_video.mp4

          echo "VIDEO_PATH=work/source_video.mp4" >> "$GITHUB_ENV"


      - name: Download Google Drive folder
        if: steps.source.outputs.source_type == 'drive_folder'
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail

          mkdir -p work/drive_videos

          echo "Downloading public Google Drive folder..."

          python -m gdown \
            "$VIDEO_URL" \
            --folder \
            --output work/drive_videos
            
            

          echo "Downloaded files:"
          find work/drive_videos -type f -print

          COUNT="$(find work/drive_videos -type f \
            \( -iname '*.mp4' -o -iname '*.mov' \
            -o -iname '*.mkv' -o -iname '*.webm' \
            -o -iname '*.m4v' \) | wc -l)"

          if [ "$COUNT" -eq 0 ]; then
            echo "No supported videos were found in the Google Drive folder."
            exit 1
          fi

          echo "Found $COUNT video(s)."
        


      - name: Set local video path
        if: steps.source.outputs.source_type == 'local'
        env:
          LOCAL_VIDEO: ${{ steps.source.outputs.video }}
        run: |
          set -euo pipefail
          echo "VIDEO_PATH=$LOCAL_VIDEO" >> "$GITHUB_ENV"

      - name: Prepare video list
        run: |
          set -euo pipefail

          mkdir -p work/videos

          find input -maxdepth 1 -type f \( \
           -iname "*.mp4" -o \
           -iname "*.mov" -o \
           -iname "*.mkv" -o \
           -iname "*.webm" \
          \) | sort > work/video_list

          VIDEO_COUNT=$(wc -l < work/video_list)

          echo "Videos to process: $VIDEO_COUNT"

          if [ "$VIDEO_COUNT" -eq 0 ]; then
            echo "No videos found in input/"
            exit 1
           fi

      - name: Process videos
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          set -euo pipefail

          INDEX=0

          while IFS= read -r -d '' VIDEO; do
            INDEX=$((INDEX + 1))

            echo "======================================"
            echo "Processing video $INDEX"
            echo "Video: $VIDEO"
            echo "======================================"

            TRANSCRIPT="work/transcript_${INDEX}.json"
            MOMENTS="work/moments_${INDEX}.json"

            python scripts/transcribe.py \
              "$VIDEO" \
              "$TRANSCRIPT"

            python scripts/content_detector.py \
              "$TRANSCRIPT" \
              "work/content_type_${INDEX}.json"

            ffprobe -v error \
              -show_entries format=duration \
              -of default=noprint_wrappers=1:nokey=1 \
              "$VIDEO" || true

            python scripts/find_moments.py \
              "$TRANSCRIPT" \
              "$MOMENTS"          

                        case "$CAMPAIGN_ID" in

              blastoff_jingle_jared_rebel_audio)
                OUTPUT_DIR="output/rebel_audio_clips/video_${INDEX}"
                mkdir -p "$OUTPUT_DIR"

                python scripts/make_clips.py \
                  "$VIDEO" \
                  "$MOMENTS" \
                  "$OUTPUT_DIR" \
                  "$TRANSCRIPT" \
                  "rebel_audio_logo_transparent-1 (1).png" \
                  "work/content_type_${INDEX}.json"
                ;;

              blastoff_warren_zeiders_md_motivator)
                OUTPUT_DIR="output/clips/video_${INDEX}"
                mkdir -p "$OUTPUT_DIR"

                python scripts/make_clips.py \
                  "$VIDEO" \
                  "$MOMENTS" \
                  "$OUTPUT_DIR" \
                  "$TRANSCRIPT" \
                  "work/content_type_${INDEX}.json"
                ;;

              *)
                echo "Unsupported campaign: $CAMPAIGN_ID"
                exit 1
                ;;
            esac

            echo "Finished video $INDEX"

          done < work/video_list

          echo "======================================"
          echo "ALL VIDEOS PROCESSED"
          echo "======================================"
  

      - name: Verify campaign assets
        run: |
          set -euo pipefail

          echo "Checking Rebel Audio logo:"
          test -f "rebel_audio_logo_transparent-1 (1).png"

          echo "Logo FOUND."
          ls -lh "rebel_audio_logo_transparent-1 (1).png"
          
          
      - name: Generate selected campaign posting package
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          set -euo pipefail

          python scripts/create_posting_packages.py \
            campaigns/config.json \
            output/clips \
            output/posting_packages \
            "$CAMPAIGN_ID"

      - name: Upload selected campaign posting package
        uses: actions/upload-artifact@v4
        with:
          name: campaign-posting-package
          path: output/posting_packages/
          if-no-files-found: error
          retention-days: 7

      - name: Upload clips and analysis
        uses: actions/upload-artifact@v4
        with:
          name: clip-machine-results
          path: |
            output/clips/**/*.mp4
            output/rebel_audio_clips/**/*.mp4
            work/transcript_*.json
            work/moments_*.json
            work/faces_*.json
          if-no-files-found: error
          retention-days: 7
