name: Clip Machine - Production Pipeline

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/clip-machine.yml
  workflow_dispatch:
    inputs:
      campaign_id:
        description: "Campaign to create clips for"
        required: true
        default: blastoff_jingle_jared_rebel_audio
        type: choice
        options:
          - blastoff_jingle_jared_rebel_audio
          - blastoff_warren_zeiders_md_motivator
      video_url:
        description: "Direct HTTPS video URL or public Google Drive folder URL (leave empty to use input/)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: clip-machine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-clips:
    name: Download, Analyze, and Create Clips
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install free system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install free Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install faster-whisper gdown opencv-python mediapipe

      - name: Preflight Python scripts
        run: python -m py_compile scripts/*.py

      - name: Create working directories
        run: |
          mkdir -p input work output/clips output/rebel_audio_clips output/posting_packages

      - name: Select video source
        id: source
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$VIDEO_URL" ]; then
            if [[ "$VIDEO_URL" == *"drive.google.com/drive/folders/"* ]]; then
              echo "source_type=drive_folder" >> "$GITHUB_OUTPUT"
            else
              echo "source_type=url" >> "$GITHUB_OUTPUT"
            fi
          else
            VIDEO_FILE="$(find input -maxdepth 1 -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.m4v' \) ! -name '.gitkeep' | sort | head -n 1)"
            if [ -z "$VIDEO_FILE" ]; then
              echo "No video URL or local video was provided."
              exit 1
            fi
            echo "source_type=local" >> "$GITHUB_OUTPUT"
            echo "video=$VIDEO_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Download video from URL
        if: steps.source.outputs.source_type == 'url'
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: python scripts/download_video.py "$VIDEO_URL" work/source_video.mp4

      - name: Download Google Drive folder
        if: steps.source.outputs.source_type == 'drive_folder'
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          mkdir -p work/drive_videos
          python -m gdown "$VIDEO_URL" --folder --output work/drive_videos
          COUNT="$(find work/drive_videos -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.m4v' \) | wc -l)"
          test "$COUNT" -gt 0

      - name: Prepare video list
        env:
          SOURCE_TYPE: ${{ steps.source.outputs.source_type }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/videos
          : > work/video_list
          case "$SOURCE_TYPE" in
            local) find input -maxdepth 1 -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.m4v' \) -print >> work/video_list ;;
            url) echo "work/source_video.mp4" >> work/video_list ;;
            drive_folder) find work/drive_videos -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.m4v' \) -print >> work/video_list ;;
          esac
          sort -u -o work/video_list work/video_list
          test -s work/video_list

      - name: Process videos
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        shell: bash
        run: |
          set -euo pipefail
          INDEX=0
          while IFS= read -r VIDEO; do
            INDEX=$((INDEX + 1))
            TRANSCRIPT="work/transcript_${INDEX}.json"
            MOMENTS_RAW="work/moments_raw_${INDEX}.json"
            MOMENTS="work/moments_${INDEX}.json"
            CONTENT_TYPE="work/content_type_${INDEX}.json"
            FACES="work/faces_${INDEX}.json"

            if ! python scripts/transcribe.py "$VIDEO" "$TRANSCRIPT"; then continue; fi
            if ! python scripts/content_detector.py "$TRANSCRIPT" "$CONTENT_TYPE"; then printf '{"content_type":"general"}\n' > "$CONTENT_TYPE"; fi
            if ! python scripts/face_tracking.py "$VIDEO" "$FACES"; then printf '{"fps":0,"samples":[]}\n' > "$FACES"; fi
            if ! python scripts/find_moments.py "$TRANSCRIPT" "$MOMENTS_RAW"; then printf '{"moments":[]}\n' > "$MOMENTS_RAW"; fi

            MOMENT_COUNT="$(python - "$MOMENTS_RAW" <<'PY'
import json,sys
with open(sys.argv[1],encoding='utf-8') as f: data=json.load(f)
moments=data if isinstance(data,list) else data.get('moments',[]) if isinstance(data,dict) else []
print(len(moments))
PY
)"
            if [ "$MOMENT_COUNT" -eq 0 ]; then
              DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO" || true)"
              python - "$MOMENTS_RAW" "$DURATION" <<'PY'
import json,sys
try: d=float(sys.argv[2])
except: d=0
if 0 < d < 180:
  with open(sys.argv[1],'w',encoding='utf-8') as f: json.dump([{'start':0.0,'end':d,'score':0,'text':'Short-source fallback clip','fallback':True,'fallback_reason':'zero_moments_under_three_minutes'}],f,indent=2)
PY
              MOMENT_COUNT="$(python -c "import json; print(len(json.load(open('$MOMENTS_RAW'))))")"
              [ "$MOMENT_COUNT" -gt 0 ] || continue
            fi

            if ! python scripts/optimize_moments.py "$TRANSCRIPT" "$MOMENTS_RAW" "$MOMENTS"; then cp "$MOMENTS_RAW" "$MOMENTS"; fi

            if [ "$CAMPAIGN_ID" = "blastoff_jingle_jared_rebel_audio" ]; then
              OUTPUT_DIR="output/rebel_audio_clips/video_${INDEX}"
              mkdir -p "$OUTPUT_DIR"
              python scripts/make_clips.py "$VIDEO" "$MOMENTS" "$OUTPUT_DIR" "$TRANSCRIPT" "rebel_audio_logo_transparent-1 (1).png" "$CONTENT_TYPE" "$FACES" || continue
            elif [ "$CAMPAIGN_ID" = "blastoff_warren_zeiders_md_motivator" ]; then
              OUTPUT_DIR="output/clips/video_${INDEX}"
              mkdir -p "$OUTPUT_DIR"
              python scripts/make_clips.py "$VIDEO" "$MOMENTS" "$OUTPUT_DIR" "$TRANSCRIPT" "$CONTENT_TYPE" "$FACES" || continue
            else
              exit 1
            fi
          done < work/video_list

      - name: Validate generated clips
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          if [ "$CAMPAIGN_ID" = "blastoff_jared_rebel_audio" ]; then CLIPS_DIR="output/rebel_audio_clips"; else CLIPS_DIR="output/clips"; fi
          python scripts/validate_clips.py "$CLIPS_DIR"

      - name: Verify campaign assets
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          if [ "$CAMPAIGN_ID" = "blastoff_jingle_jared_rebel_audio" ]; then test -f "rebel_audio_logo_transparent-1 (1).png"; fi

      - name: Generate selected campaign posting package
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          if [ "$CAMPAIGN_ID" = "blastoff_jingle_jared_rebel_audio" ]; then POSTING_CLIPS_DIR="output/rebel_audio_clips"; else POSTING_CLIPS_DIR="output/clips"; fi
          python scripts/create_posting_packages.py campaigns/config.json "$POSTING_CLIPS_DIR" output/posting_packages "$CAMPAIGN_ID"

      - name: Upload selected campaign posting package
        uses: actions/upload-artifact@v4
        with:
          name: campaign-posting-package
          path: output/posting_packages/
          if-no-files-found: error
          retention-days: 7

      - name: Upload clips and analysis
        uses: actions/upload-artifact@v4
        with:
          name: clip-machine-results
          path: |
            output/clips/**/*.mp4
            output/clips/**/*.json
            output/rebel_audio_clips/**/*.mp4
            output/rebel_audio_clips/**/*.json
            work/transcript_*.json
            work/moments_*.json
            work/moments_raw_*.json
            work/content_type_*.json
            work/faces_*.json
          if-no-files-found: error
          retention-days: 7
