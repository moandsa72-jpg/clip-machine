# Clip Machine main workflow
name: Clip Machine - Main Campaign Runner

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: "Campaign to create content for"
        required: true
        type: choice
        options:
          - blastoff_jingle_jared_rebel_audio
          - blastoff_warren_zeiders_md_motivator
          - popmart_skullpanda
      video_url:
        description: "Video URL or public Google Drive folder for video campaigns; ignored for SKULLPANDA photo mode"
        required: false
        type: string
      posting_platform:
        description: "Posting stage"
        required: true
        type: choice
        options:
          - none
          - youtube_shorts
          - tiktok
          - instagram_reels
          - facebook_reels
        default: none
      publish_now:
        description: "Explicitly authorize publishing eligible YouTube queue items"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: clip-machine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-content:
    name: Create selected campaign content
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install faster-whisper gdown opencv-python mediapipe==0.10.21

      - name: Check scripts and campaign
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          python -m py_compile scripts/*.py
          python scripts/doctor.py "$CAMPAIGN_ID"

      - name: Prepare directories
        run: |
          mkdir -p input work work/state work/drive_videos output/clips output/rebel_audio_clips output/campaign_drafts output/posting_packages output/posting_dashboard output/campaign_opportunities output/posting_queue

      # ------------------------------------------------------------
      # SKULLPANDA PHOTO CAMPAIGN
      # ------------------------------------------------------------
      - name: Render SKULLPANDA photo draft
        if: inputs.campaign_id == 'popmart_skullpanda'
        shell: bash
        run: |
          set -euo pipefail
          PHOTO_SOURCE=""
          if find input -maxdepth 1 -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -print -quit | grep -q .; then
            PHOTO_SOURCE="input"
          elif [ -f "input/Doja Cat x Pop Mart.zip" ]; then
            PHOTO_SOURCE="input/Doja Cat x Pop Mart.zip"
          else
            echo "SKULLPANDA needs campaign photos in input/ (JPG/PNG/WEBP) or input/Doja Cat x Pop Mart.zip"
            exit 1
          fi
          python scripts/create_photo_campaign_draft.py "$PHOTO_SOURCE" --output output/campaign_drafts/skullpanda_draft.mp4

      - name: Prepare SKULLPANDA posting package
        if: inputs.campaign_id == 'popmart_skullpanda'
        run: |
          set -euo pipefail
          mkdir -p output/posting_packages/popmart_skullpanda
          cp campaigns/popmart_skullpanda/posting_package.md output/posting_packages/popmart_skullpanda/
          cp campaigns/popmart_skullpanda/storyboard.json output/posting_packages/popmart_skullpanda/
          cat > output/posting_packages/popmart_skullpanda/post.json <<'JSON'
          {
            "campaign_id": "popmart_skullpanda",
            "title": "SKULLPANDA at Doja Cat’s 31st Birthday Party",
            "caption": "SKULLPANDA\n#skullpanda @popmart_us",
            "platforms": ["TikTok", "Instagram Reels", "YouTube Shorts", "X"],
            "status": "draft_requires_campaign_review",
            "preapproval_required": true
          }
          JSON

      # ------------------------------------------------------------
      # VIDEO CAMPAIGNS
      # ------------------------------------------------------------
      - name: Select video source
        if: inputs.campaign_id != 'popmart_skullpanda'
        id: source
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$VIDEO_URL" ]; then
            SOURCE_KEY="$(printf '%s' "$VIDEO_URL" | sha256sum | cut -d' ' -f1)"
            if [[ "$VIDEO_URL" == *"drive.google.com/drive/folders/"* ]]; then
              echo "source_type=drive_folder" >> "$GITHUB_OUTPUT"
            else
              echo "source_type=url" >> "$GITHUB_OUTPUT"
            fi
          else
            SOURCE_KEY="local"
            echo "source_type=local" >> "$GITHUB_OUTPUT"
          fi
          echo "source_key=$SOURCE_KEY" >> "$GITHUB_OUTPUT"

      - name: Download video from URL
        if: inputs.campaign_id != 'popmart_skullpanda' && steps.source.outputs.source_type == 'url'
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: python scripts/download_video.py "$VIDEO_URL" work/source_video.mp4

      - name: Download Google Drive folder
        if: inputs.campaign_id != 'popmart_skullpanda' && steps.source.outputs.source_type == 'drive_folder'
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail
          python -m gdown "$VIDEO_URL" --folder --output work/drive_videos
          test "$(find work/drive_videos -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.m4v' \) | wc -l)" -gt 0

      - name: Prepare video list
        if: inputs.campaign_id != 'popmart_skullpanda'
        env:
          SOURCE_TYPE: ${{ steps.source.outputs.source_type }}
        run: |
          set -euo pipefail
          : > work/video_list
          case "$SOURCE_TYPE" in
            local) find input -maxdepth 1 -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.m4v' \) -print >> work/video_list ;;
            url) echo work/source_video.mp4 >> work/video_list ;;
            drive_folder) find work/drive_videos -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.m4v' \) -print >> work/video_list ;;
          esac
          sort -u -o work/video_list work/video_list
          test "$(wc -l < work/video_list)" -gt 0
          cat work/video_list

      - name: Process video campaigns
        if: inputs.campaign_id != 'popmart_skullpanda'
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        shell: bash
        run: |
          set -euo pipefail
          INDEX=0
          while IFS= read -r VIDEO; do
            INDEX=$((INDEX + 1))
            TRANSCRIPT="work/transcript_${INDEX}.json"
            RAW_MOMENTS="work/moments_raw_${INDEX}.json"
            MOMENTS="work/moments_${INDEX}.json"
            CONTENT_TYPE="work/content_type_${INDEX}.json"
            FACES="work/faces_${INDEX}.json"

            python scripts/transcribe.py "$VIDEO" "$TRANSCRIPT"
            python scripts/content_detector.py "$TRANSCRIPT" "$CONTENT_TYPE"
            python scripts/face_tracking.py "$VIDEO" "$FACES"
            python scripts/find_moments.py "$TRANSCRIPT" "$RAW_MOMENTS"

            COUNT="$(python - "$RAW_MOMENTS" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          print(len(d if isinstance(d,list) else d.get('moments',[])))
          PY
          )"
            if [ "$COUNT" -eq 0 ]; then
              DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO")"
              python - "$RAW_MOMENTS" "$DURATION" <<'PY'
          import json,sys
          duration=float(sys.argv[2])
          if duration < 180:
              json.dump([{'start':0.0,'end':duration,'score':0,'text':'Short-source fallback clip','fallback':True}],open(sys.argv[1],'w',encoding='utf-8'),indent=2)
          PY
            fi

            python scripts/optimize_moments.py "$TRANSCRIPT" "$RAW_MOMENTS" "$MOMENTS" campaigns/config.json "$CAMPAIGN_ID"

            if [ "$CAMPAIGN_ID" = "blastoff_jingle_jared_rebel_audio" ]; then
              OUTPUT_DIR="output/rebel_audio_clips/video_${INDEX}"
              python scripts/make_clips.py "$VIDEO" "$MOMENTS" "$OUTPUT_DIR" "$TRANSCRIPT" "rebel_audio_logo_transparent-1 (1).png" "$CONTENT_TYPE" "$FACES"
            else
              OUTPUT_DIR="output/clips/video_${INDEX}"
              python scripts/make_clips.py "$VIDEO" "$MOMENTS" "$OUTPUT_DIR" "$TRANSCRIPT" "$CONTENT_TYPE" "$FACES"
            fi
          done < work/video_list

      - name: Validate video campaign clips
        if: inputs.campaign_id != 'popmart_skullpanda'
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          if [ "$CAMPAIGN_ID" = "blastoff_jingle_jared_rebel_audio" ]; then
            python scripts/validate_clips.py output/rebel_audio_clips
          else
            python scripts/validate_clips.py output/clips
          fi

      - name: Generate video campaign posting package
        if: inputs.campaign_id != 'popmart_skullpanda'
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          if [ "$CAMPAIGN_ID" = "blastoff_jingle_jared_rebel_audio" ]; then POSTING_CLIPS_DIR=output/rebel_audio_clips; else POSTING_CLIPS_DIR=output/clips; fi
          python scripts/create_posting_packages.py campaigns/config.json "$POSTING_CLIPS_DIR" output/posting_packages "$CAMPAIGN_ID"
          python scripts/create_posting_dashboard.py "output/posting_packages/$CAMPAIGN_ID/posting_package.json" "output/posting_dashboard/$CAMPAIGN_ID"

      - name: Refresh campaign radar
        run: |
          if ! python3 campaign-radar/campaign_scanner.py; then
            printf '%s\n' '{"campaigns":[],"kick_campaigns":[],"errors":["public campaign scan failed"]}' > campaign-radar/latest.json
          fi
          python3 campaign-radar/expand_public_sources.py

      - name: Match campaign opportunities
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          if [ -f "output/posting_packages/$CAMPAIGN_ID/posting_package.json" ]; then
            python scripts/create_campaign_opportunities.py campaign-radar/latest.json "output/posting_packages/$CAMPAIGN_ID/posting_package.json" output/campaign_opportunities/opportunities.json
            python scripts/create_posting_queue.py output/campaign_opportunities/opportunities.json "output/posting_packages/$CAMPAIGN_ID/posting_package.json" output/posting_queue/posting_queue.json
          else
            echo "Photo campaign uses its dedicated pre-approval package."
          fi

      - name: Upload selected campaign package
        uses: actions/upload-artifact@v4
        with:
          name: campaign-posting-package-${{ inputs.campaign_id }}
          path: output/posting_packages/
          if-no-files-found: error
          retention-days: 7

      - name: Upload photo draft
        if: inputs.campaign_id == 'popmart_skullpanda'
        uses: actions/upload-artifact@v4
        with:
          name: skullpanda-draft
          path: output/campaign_drafts/skullpanda_draft.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Upload video clips
        if: inputs.campaign_id != 'popmart_skullpanda'
        uses: actions/upload-artifact@v4
        with:
          name: clip-machine-results-${{ inputs.campaign_id }}
          path: |
            output/clips/**/*.mp4
            output/clips/**/*.json
            output/rebel_audio_clips/**/*.mp4
            output/rebel_audio_clips/**/*.json
            work/transcript_*.json
            work/moments_*.json
            work/moments_raw_*.json
            work/content_type_*.json
            work/faces_*.json
          if-no-files-found: error
          retention-days: 7
