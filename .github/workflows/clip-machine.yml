name: Clip Machine - Transcribe and Find Moments

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Direct HTTPS video URL (leave empty to use input/)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: clip-machine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-clips:
    name: Download, Analyze, and Create Clips
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install faster-whisper

      - name: Create working directories
        run: |
          mkdir -p input
          mkdir -p work
          mkdir -p output/clips

      - name: Select video source
        id: source
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$VIDEO_URL" ]; then
            echo "source_type=url" >> "$GITHUB_OUTPUT"
          else
            VIDEO_FILE="$(find input -maxdepth 1 -type f \
              \( -iname '*.mp4' -o -iname '*.mov' \
              -o -iname '*.mkv' -o -iname '*.webm' \
              -o -iname '*.m4v' \) \
              ! -name '.gitkeep' | head -n 1)"

            if [ -z "$VIDEO_FILE" ]; then
              echo "No video URL or local video was provided."
              echo "Add a direct HTTPS URL or put a video in input/."
              exit 1
            fi

            echo "source_type=local" >> "$GITHUB_OUTPUT"
            echo "video=$VIDEO_FILE" >> "$GITHUB_OUTPUT"
            echo "Using local video: $VIDEO_FILE"
          fi

      - name: Download video from URL
        if: steps.source.outputs.source_type == 'url'
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail
          python scripts/download_video.py \
            "$VIDEO_URL" \
            work/source_video.mp4

          echo "VIDEO_PATH=work/source_video.mp4" >> "$GITHUB_ENV"

      - name: Set local video path
        if: steps.source.outputs.source_type == 'local'
        env:
          LOCAL_VIDEO: ${{ steps.source.outputs.video }}
        run: |
          set -euo pipefail
          echo "VIDEO_PATH=$LOCAL_VIDEO" >> "$GITHUB_ENV"

      - name: Transcribe video
        run: |
          set -euo pipefail
          python scripts/transcribe.py \
            "$VIDEO_PATH" \
            work/transcript.json

      - name: Verify video with FFprobe
        run: |
          set -euo pipefail

          if [ ! -f "$VIDEO_PATH" ]; then
            echo "Video file not found: $VIDEO_PATH"
            exit 1
          fi

          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$VIDEO_PATH"

          echo "Video source verified."

      - name: Find promising moments
        run: |
          set -euo pipefail
          python scripts/find_moments.py \
            work/transcript.json \
            work/moments.json

      - name: Create vertical clips with animated captions
        run: |
          set -euo pipefail
          python scripts/make_clips.py \
            "$VIDEO_PATH" \
            work/moments.json \
            output/clips \
            work/transcript.json

      - name: Verify generated clips
        run: |
          set -euo pipefail

          COUNT="$(find output/clips -maxdepth 1 \
            -type f -name '*.mp4' | wc -l)"

          if [ "$COUNT" -eq 0 ]; then
            echo "No clips were generated."
            exit 1
          fi

          echo "Successfully generated $COUNT clip(s)."
          ls -lh output/clips/

      - name: Upload clips and analysis
        uses: actions/upload-artifact@v4
        with:
          name: clip-machine-results
          path: |
            output/clips/*.mp4
            work/transcript.json
            work/moments.json
          if-no-files-found: error
          retention-days: 7
