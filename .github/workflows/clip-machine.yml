# Clip Machine production workflow — registration refresh; pipeline unchanged.
name: Clip Machine

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: "Campaign to create clips for"
        required: true
        default: blastoff_jingle_jared_rebel_audio
        type: choice
        options:
          - blastoff_jingle_jared_rebel_audio
          - blastoff_warren_zeiders_md_motivator
      video_url:
        description: "Direct HTTPS video URL or public Google Drive folder URL (leave empty to use input/)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: clip-machine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-clips:
    name: Download, Analyze, and Create Clips
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install free system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu
      - name: Set up Python
        run: python -m pip install --upgrade pip
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free Python packages
        run: |
          python -m pip install faster-whisper gdown opencv-python mediapipe
      - name: Preflight Python scripts
        run: python -m py_compile scripts/*.py
      - name: Create working directories
        run: mkdir -p input work output/clips output/rebel_audio_clips output/posting_packages
      - name: Select video source
        id: source
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$VIDEO_URL" ]; then
            if [[ "$VIDEO_URL" == *"drive.google.com/drive/folders/"* ]]; then echo "source_type=drive_folder" >> "$GITHUB_OUTPUT"; else echo "source_type=url" >> "$GITHUB_OUTPUT"; fi
          else
            VIDEO_FILE="$(find input -maxdepth 1 -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.m4v' \) ! -name '.gitkeep' | sort | head -n 1)"
            [ -n "$VIDEO_FILE" ] || { echo "No video URL or local video was provided."; exit 1; }
            echo "source_type=local" >> "$GITHUB_OUTPUT"
          fi
      - name: Download video from URL
        if: steps.source.outputs.source_type == 'url'
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: python scripts/download_video.py "$VIDEO_URL" work/source_video.mp4
      - name: Download Google Drive folder
        if: steps.source.outputs.source_type == 'drive_folder'
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          mkdir -p work/drive_videos
          python -m gdown "$VIDEO_URL" --folder --output work/drive_videos
          test "$(find work/drive_videos -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.m4v' \) | wc -l)" -gt 0
      - name: Prepare video list
        env:
          SOURCE_TYPE: ${{ steps.source.outputs.source_type }}
        shell: bash
        run: |
          set -euo pipefail
          : > work/video_list
          case "$SOURCE_TYPE" in
            local) find input -maxdepth 1 -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.m4v' \) -print >> work/video_list ;;
            url) echo work/source_video.mp4 >> work/video_list ;;
            drive_folder) find work/drive_videos -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.m4v' \) -print >> work/video_list ;;
          esac
          sort -u -o work/video_list work/video_list
          test -s work/video_list
      - name: Process videos
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        shell: bash
        run: |
          set -euo pipefail
          INDEX=0
          while IFS= read -r VIDEO; do
            INDEX=$((INDEX + 1))
            T="work/transcript_${INDEX}.json"; R="work/moments_raw_${INDEX}.json"; M="work/moments_${INDEX}.json"; C="work/content_type_${INDEX}.json"; F="work/faces_${INDEX}.json"
            python scripts/transcribe.py "$VIDEO" "$T" || continue
            python scripts/content_detector.py "$T" "$C" || printf '{"content_type":"general"}\n' > "$C"
            python scripts/face_tracking.py "$VIDEO" "$F" || printf '{"fps":0,"samples":[]}\n' > "$F"
            python scripts/find_moments.py "$T" "$R" || printf '{"moments":[]}\n' > "$R"
            COUNT="$(python - "$R" <<'PY'
import json,sys
x=json.load(open(sys.argv[1])); print(len(x if isinstance(x,list) else x.get('moments',[]) if isinstance(x,dict) else []))
PY
)"
            if [ "$COUNT" -eq 0 ]; then
              D="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$VIDEO" || true)"
              python - "$R" "$D" <<'PY'
import json,sys
try:d=float(sys.argv[2])
except:d=0
if 0<d<180: json.dump([{'start':0.0,'end':d,'score':0,'text':'Short-source fallback clip','fallback':True,'fallback_reason':'zero_moments_under_three_minutes'}],open(sys.argv[1],'w'),indent=2)
PY
              COUNT="$(python -c "import json;print(len(json.load(open('$R'))))")"
              [ "$COUNT" -gt 0 ] || continue
            fi
            python scripts/optimize_moments.py "$T" "$R" "$M" || cp "$R" "$M"
            if [ "$CAMPAIGN_ID" = "blastoff_jingle_jared_rebel_audio" ]; then
              O="output/rebel_audio_clips/video_${INDEX}"; mkdir -p "$O"
              python scripts/make_clips.py "$VIDEO" "$M" "$O" "$T" "rebel_audio_logo_transparent-1 (1).png" "$C" "$F" || continue
            elif [ "$CAMPAIGN_ID" = "blastoff_warren_zeiders_md_motivator" ]; then
              O="output/clips/video_${INDEX}"; mkdir -p "$O"
              python scripts/make_clips.py "$VIDEO" "$M" "$O" "$T" "$C" "$F" || continue
            else exit 1; fi
          done < work/video_list
      - name: Validate generated clips
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          if [ "$CAMPAIGN_ID" = "blastoff_jingle_jared_rebel_audio" ]; then D=output/rebel_audio_clips; else D=output/clips; fi
          python scripts/validate_clips.py "$D"
      - name: Verify campaign assets
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: if [ "$CAMPAIGN_ID" = "blastoff_jingle_jared_rebel_audio" ]; then test -f "rebel_audio_logo_transparent-1 (1).png"; fi
      - name: Generate selected campaign posting package
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
        run: |
          if [ "$CAMPAIGN_ID" = "blastoff_jingle_jared_rebel_audio" ]; then D=output/rebel_audio_clips; else D=output/clips; fi
          python scripts/create_posting_packages.py campaigns/config.json "$D" output/posting_packages "$CAMPAIGN_ID"
      - name: Upload selected campaign posting package
        uses: actions/upload-artifact@v4
        with:
          name: campaign-posting-package
          path: output/posting_packages/
          if-no-files-found: error
          retention-days: 7
      - name: Upload clips and analysis
        uses: actions/upload-artifact@v4
        with:
          name: clip-machine-results
          path: |
            output/clips/**/*.mp4
            output/clips/**/*.json
            output/rebel_audio_clips/**/*.mp4
            output/rebel_audio_clips/**/*.json
            work/transcript_*.json
            work/moments_*.json
            work/moments_raw_*.json
            work/content_type_*.json
            work/faces_*.json
          if-no-files-found: error
          retention-days: 7
