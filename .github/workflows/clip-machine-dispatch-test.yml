name: Clip Machine - Dispatch Test

on:
  workflow_dispatch:

jobs:
  dispatch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify production workflow
        shell: bash
        run: |
          set -e
          test -f .github/workflows/clip-machine-run.yml
          grep -q '^name: Clip Machine - Production Pipeline$' .github/workflows/clip-machine-run.yml
          grep -q 'workflow_dispatch:' .github/workflows/clip-machine-run.yml
          echo "Dispatch registration test passed."
          echo "Production workflow is present on the default branch and has workflow_dispatch."
