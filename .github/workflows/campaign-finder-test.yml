name: Test Campaign Finder

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: "Campaign finder test config"
        required: true
        default: "campaign-radar/testing/config.json"
        type: string

permissions:
  contents: read

jobs:
  campaign-finder-test:
    name: Scan public campaign listings
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run campaign finder only
        run: |
          python campaign-radar/campaign_scanner.py \
            --config "${{ inputs.config_file }}" \
            --output campaign-radar/testing/latest.json

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-finder-test-report
          path: campaign-radar/testing/latest.json
          if-no-files-found: warn
          retention-days: 7
