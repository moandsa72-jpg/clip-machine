name: Campaign Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run free campaign radar
        run: python3 campaign-radar/campaign_scanner.py

      - name: Upload radar report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campaign-radar-report
          path: campaign-radar/latest.json
          if-no-files-found: ignore
